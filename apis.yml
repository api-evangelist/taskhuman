aid: taskhuman
name: TaskHuman
description: >-
  TaskHuman was a mobile-first, on-demand human coaching platform that connected employees with live
  1:1 video coaching across wellbeing, fitness, leadership, professional growth, sales and mentorship
  topics, sold to employers as a benefit and delivered through iOS, Android and web apps plus Slack
  and Microsoft Teams integrations. The San Francisco Bay Area company raised roughly $35M from
  investors including U.S. Venture Partners and Madrona and marketed a coach network spanning more
  than a thousand skill areas. The company ceased operations in 2026; as of this profile the entire
  taskhuman.com origin answers HTTP 401 behind an nginx HTTP Basic authentication wall and the
  product's API and application hosts no longer resolve, so no developer program, documentation or
  machine-readable contract remains reachable.
