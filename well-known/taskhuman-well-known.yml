summary: >-
  No /.well-known/ document is served anywhere on the TaskHuman estate. The company's own origin
  (taskhuman.com and www.taskhuman.com, same nginx behind Cloudflare) answers HTTP 401 with
  WWW-Authenticate: Basic realm="taskhuman2pro" for EVERY path, including /robots.txt and every
  /.well-known/ probe, so nothing on the primary domain is publicly readable. The only host on the
  domain still serving public content is resources.taskhuman.com, a leftover HubSpot marketing
  microsite, and it 404s every /.well-known/ path.
pointer_basis: >-
  NO WellKnown pointer and NO SecurityTxt pointer emitted. Every probe below is a 401 or a 404;
  not one path returned a document. This file records an absence, and an absence must not be
  wired as a presence.
notes: >-
  taskhuman.com's 401 is an nginx HTTP Basic authentication wall, NOT a bot challenge or WAF
  interstitial — the response carries a WWW-Authenticate: Basic header with a named realm, and it
  is returned identically to browser and crawler user agents. It is a wall the operator put up,
  not one our crawler tripped. The former API and application hosts (api.taskhuman.com,
  api.prod.taskhuman.com, app.taskhuman.com, admin.taskhuman.com) either no longer resolve or are
  dangling CNAMEs pointing at deleted CloudFront distributions and ELBs, so there was no API host
  left to probe.
